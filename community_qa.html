  <style>
    /* 게시판 카드 hover 부유 효과 비활성화 */
    .content-card:hover {
      transform: none;
      box-shadow: var(--shadow-lg);
    }

    .accordion-container {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .accordion-item {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .accordion-item.active {
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(26,54,93,0.08);
    }

    .accordion-header {
      display: flex;
      align-items: center;
      padding: 1.2rem 1.5rem;
      cursor: pointer;
      background: #f8f9fa;
      transition: background 0.2s;
      gap: 1rem;
      border: none;
      width: 100%;
      text-align: left;
    }

    .accordion-header:hover {
      background: #f0f3f7;
    }

    .accordion-item.active .accordion-header {
      background: #eef2f8;
      border-left: 3px solid var(--primary);
    }

    .q-icon {
      background: var(--primary);
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .accordion-header h3 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      flex: 1;
      line-height: 1.5;
      color: #334a6c;
    }

    .accordion-item.active .accordion-header h3 {
      color: var(--primary);
    }

    .toggle-icon {
      transition: transform 0.25s ease;
      font-size: 0.85rem;
      color: #adb5bd;
      flex-shrink: 0;
    }

    .accordion-item.active .toggle-icon {
      transform: rotate(180deg);
      color: var(--primary);
    }

    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      background: #fff;
    }

    .answer-wrapper {
      display: flex;
      gap: 1rem;
      padding: 1.2rem 1.5rem;
      border-top: 1px solid #e9ecef;
    }

    .a-icon {
      background: #2a9d5c;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .answer-content {
      flex: 1;
      line-height: 1.7;
      color: #4a5568;
      font-size: 0.95rem;
    }

    /* Quick Contact Sidebar */
    .quick-contact-sidebar {
      position: fixed;
      top: 50%;
      right: 40px;
      width: 240px;
      z-index: 100;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      background: #fff;
      transform: translateY(-50%);
    }
    .contact-box {
      margin-bottom: 1rem;
      text-align: center;
      padding: 1.5rem 1rem;
    }
    .contact-box h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0 0 1rem;
      color: var(--primary);
    }
    .contact-box .phone-number {
      font-size: 1.3rem;
      font-weight: 700;
      color: #333;
    }
    .contact-box .kakao-link {
      display: block;
      background-color: #ffeb00;
      padding: 1rem;
      text-decoration: none;
      color: #3c1e1e;
      font-weight: 600;
      transition: background-color 0.3s;
    }
    .contact-box .kakao-link:hover {
      background-color: #fdd835;
    }
    @media (max-width: 1200px) {
      .quick-contact-sidebar { display: none; }
    }

    /* 모바일 최적화 */
    @media (max-width: 768px) {
      .accordion-header {
        padding: 1rem 1.2rem;
        gap: 0.7rem;
      }
      .answer-wrapper {
        padding: 1rem 1.2rem;
        gap: 0.7rem;
      }
      .accordion-container {
        gap: 0.6rem;
      }
    }

    @media (max-width: 576px) {
      .accordion-header {
        padding: 0.9rem 1rem;
        gap: 0.6rem;
      }
      .accordion-header h3 {
        font-size: 0.9rem;
      }
      .q-icon, .a-icon {
        width: 24px;
        height: 24px;
        font-size: 0.8rem;
      }
      .answer-wrapper {
        padding: 0.9rem 1rem;
        gap: 0.6rem;
      }
      .answer-content {
        font-size: 0.9rem;
      }
      .accordion-container {

    @media (max-width: 480px) {

      }
      .answer-wrapper {
        padding: 0.8rem;
        gap: 0.5rem;
      }
      .answer-content {
        font-size: 0.85rem;
      }
    }
  </style>

  <script>
    function escapeQaText(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function showFaqMessage(container, message) {
      container.innerHTML = `<div style="text-align:center; padding:3rem 1rem; color:#888;"><p>${message}</p></div>`;
    }

    async function loadFAQData() {
      const container = document.querySelector('.accordion-container');
      if (!container) return;
      showFaqMessage(container, '자주 묻는 질문을 불러오는 중입니다...');
      try {
        if (!window.supabaseClient) throw new Error('Supabase 연결 없음');
        const { data, error } = await window.supabaseClient
          .from('qa')
          .select('*')
          .order('order', { ascending: true });

        if (error) throw error;

        container.innerHTML = '';
        if (!data || data.length === 0) {
          showFaqMessage(container, '등록된 질문이 없습니다.');
          return;
        }

        data.forEach((faq, index) => {
          const contentId = `faq-content-${index}`;
          const item = document.createElement('div');
          item.className = 'accordion-item';
          item.dataset.accordionBound = 'qa';
          item.innerHTML = `
            <button type="button" class="accordion-header" aria-expanded="false" aria-controls="${contentId}">
              <span class="q-icon">Q</span>
              <h3>${escapeQaText(faq.question)}</h3>
              <i class="fas fa-chevron-down toggle-icon" aria-hidden="true"></i>
            </button>
            <div class="accordion-content" id="${contentId}">
              <div class="answer-wrapper">
                <span class="a-icon">A</span>
                <div class="answer-content">${escapeQaText(faq.answer).replace(/\n/g, '<br>')}</div>
              </div>
            </div>
          `;
          container.appendChild(item);
        });

        initializeAccordion();
      } catch (e) {
        console.error('FAQ 데이터 로드 중 오류:', e);
        showFaqMessage(container, '질문 목록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
      }
    }

    function initializeAccordion() {
      document.querySelectorAll('.accordion-header').forEach(header => {
        header.addEventListener('click', function () {
          const item = this.closest('.accordion-item');
          const content = item.querySelector('.accordion-content');
          const isActive = item.classList.contains('active');

          // 모두 닫기
          document.querySelectorAll('.accordion-item').forEach(el => {
            el.classList.remove('active');
            el.querySelector('.accordion-content').style.maxHeight = '0';
            el.querySelector('.accordion-header').setAttribute('aria-expanded', 'false');
          });

          // 클릭한 항목 열기 (토글)
          if (!isActive) {
            item.classList.add('active');
            content.style.maxHeight = content.scrollHeight + 'px';
            this.setAttribute('aria-expanded', 'true');
          }
        });
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      loadFAQData();
    });
  </script>
  <script src="script.js" defer></script>
